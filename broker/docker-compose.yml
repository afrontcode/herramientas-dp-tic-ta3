services:
  emqx:
    image: emqx/emqx:latest
    container_name: emqx_broker
    restart: always
    ports:
      - "1883:1883"   # MQTT Inseguro
      - "8883:8883"   # MQTT Seguro con TLS/SSL
      - "8083:8083"   # MQTT sobre WebSockets
      - "18083:18083" # Panel de administración EMQX
    volumes:
      - ../certs:/opt/emqx/etc/certs:ro



  influxdb:
    image: influxdb:2.7
    container_name: iot_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: iotadmin
      DOCKER_INFLUXDB_INIT_PASSWORD: Cambiar_Clave_Influx_2026
      DOCKER_INFLUXDB_INIT_ORG: iot
      DOCKER_INFLUXDB_INIT_BUCKET: sensores
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: CAMBIAR_TOKEN_LARGO_DE_LABORATORIO
    volumes:
      - influxdb_data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana-oss:latest
    container_name: iot_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  influxdb_data:
  grafana_data: